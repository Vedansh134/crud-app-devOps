services:
  
  backend:
    container_name: node-crud-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
    - "5000:5000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/studentdb
      - PORT=5000
    depends_on:
    - mongodb
    networks:
    - crud-network
    restart: unless-stopped

  mongodb:
    container_name: mongodb
    image: mongo:latest
    ports:
    - "27017:27017"
    volumes:
    - crud-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=studentdb
    healthcheck:
      test: ["CMD","mongosh","--eval","db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
    - crud-network
    restart: unless-stopped

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
    - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
    - crud-network

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
    - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
    - crud-network

volumes:
  crud-data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  crud-network:
    driver: bridge