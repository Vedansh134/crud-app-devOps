# Define the name of workflow
name: Deploy node.js crud app

# Trigger on:push
on:
    push:
        branches: [ main ] # run when you push on main branch
    
# What task to do
jobs:
    deploy:
        runs-on: ubuntu-latest # runs oon ubuntu server

        # Different steps to run
        steps:

            # Step-1 : Fetch code from GitHub
            - name: Checkout Code
              uses: actions/checkout@v4

            # Step-2 : Docker login. 
            # (You need to save your Docker credentials in GitHub Secrets first!)
            - name: Login to Docker
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}

            # Step-3 : Build your docker image
            - name: Build Docker Image
              run: |
                  # Build docker image by tag:latest
                  docker build -t ${{ secrets.DOCKER_USERNAME }}/crud-node-app:latest .
            
            # Step-4 : Normal test docker compose
            - name: Test app
              run: |
                  # Start app using docker compose
                  docker-compose up -d

                  # wait for 10s app ready
                  sleep 10

                  # check docker images
                  docker images

                  # check all running containers
                  docker ps -a

            # Step-5 : Push Images to Docker Hub
            - name: Push Docker Images
              run: |
                  docker push ${{ secrets.DOCKER_USERNAME }}/crud-node-app:latest



            